name: 'Secure-AI-Code-Review-Action'
description: 'DevSecOps GitHub Action analyzing PR diffs strictly for security vulnerabilities, race conditions, and missing unit test coverage.'
branding:
  icon: 'shield'
  color: 'red'
author: 'Irene Therese Joseph'
inputs:
  debug:
    required: false
    description: 'Enable debug mode'
    default: 'false'
  max_files:
    required: false
    description:
      'Max files to summarize and review. Less than or equal to 0 means no
      limit.'
    default: '150'
  review_simple_changes:
    required: false
    description: 'Review even when the changes are simple'
    default: 'false'
  review_comment_lgtm:
    required: false
    description: 'Leave comments even if the patch is LGTM'
    default: 'false'
  path_filters:
    required: false
    description: |
      The path filters, e.g., "src/**.py", "!dist/**", each line will be considered as one pattern.
      See also

      - https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
      - https://github.com/isaacs/minimatch
    default: |
      !dist/**
      !**/*.app
      !**/*.bin
      !**/*.bz2
      !**/*.class
      !**/*.db
      !**/*.csv
      !**/*.tsv
      !**/*.dat
      !**/*.dll
      !**/*.dylib
      !**/*.egg
      !**/*.glif
      !**/*.gz
      !**/*.xz
      !**/*.zip
      !**/*.7z
      !**/*.rar
      !**/*.zst
      !**/*.ico
      !**/*.jar
      !**/*.tar
      !**/*.war
      !**/*.lo
      !**/*.log
      !**/*.mp3
      !**/*.wav
      !**/*.wma
      !**/*.mp4
      !**/*.avi
      !**/*.mkv
      !**/*.wmv
      !**/*.m4a
      !**/*.m4v
      !**/*.3gp
      !**/*.3g2
      !**/*.rm
      !**/*.mov
      !**/*.flv
      !**/*.iso
      !**/*.swf
      !**/*.flac
      !**/*.nar
      !**/*.o
      !**/*.ogg
      !**/*.otf
      !**/*.p
      !**/*.pdf
      !**/*.doc
      !**/*.docx
      !**/*.xls
      !**/*.xlsx
      !**/*.ppt
      !**/*.pptx
      !**/*.pkl
      !**/*.pickle
      !**/*.pyc
      !**/*.pyd
      !**/*.pyo
      !**/*.pub
      !**/*.pem
      !**/*.rkt
      !**/*.so
      !**/*.ss
      !**/*.eot
      !**/*.exe
      !**/*.pb.go
      !**/*.lock
      !**/*.ttf
      !**/*.yaml
      !**/*.yml
      !**/*.cfg
      !**/*.toml
      !**/*.ini
      !**/*.mod
      !**/*.sum
      !**/*.work
      !**/*.json
      !**/*.mmd
      !**/*.svg
      !**/*.jpeg
      !**/*.jpg
      !**/*.png
      !**/*.gif
      !**/*.bmp
      !**/*.tiff
      !**/*.webm
      !**/*.woff
      !**/*.woff2
      !**/*.dot
      !**/*.md5sum
      !**/*.wasm
      !**/*.snap
      !**/*.parquet
      !**/gen/**
      !**/_gen/**
      !**/generated/**
      !**/@generated/**
      !**/vendor/**
      !**/*.min.js
      !**/*.min.js.map
      !**/*.min.js.css
      !**/*.tfstate
      !**/*.tfstate.backup
  disable_review:
    required: false
    description: 'Only provide the summary and skip the code review.'
    default: 'false'

  openai_base_url:
    required: false
    description: 'The url of the openai api interface.'
    default: 'https://api.openai.com/v1'
  openai_light_model:
    required: false
    description:
      'Model to use for simple tasks like summarizing diff on a file.'
    default: 'gpt-3.5-turbo'
  openai_heavy_model:
    required: false
    description: 'Model to use for complex tasks such as code reviews.'
    default: 'gpt-4o-mini'
  openai_model_temperature:
    required: false
    description: 'Temperature for GPT model'
    default: '0.05'
  openai_retries:
    required: false
    description:
      'How many times to retry OpenAI API in case of timeouts or errors?'
    default: '5'
  openai_timeout_ms:
    required: false
    description: 'Timeout for OpenAI API call in millis'
    default: '360000'
  openai_concurrency_limit:
    required: false
    description: 'How many concurrent API calls to make to OpenAI servers?'
    default: '6'
  github_concurrency_limit:
    required: false
    description: 'How many concurrent API calls to make to GitHub?'
    default: '6'
  system_message:
    required: false
    description: 'System message to be sent to OpenAI'
    default: |
      You are a pragmatic, senior human security engineer performing a focused DevSecOps Pull Request code review.

      PERSONA & TONE:
      - Act like a senior, seasoned security engineer pair-programming with the author.
      - Use terse, direct, and collaborative language. Speak engineer-to-engineer.
      - NEVER use robotic phrases or conversational fluff like "As an AI", "I recommend", "Here is a breakdown", "Certainly!", or polite introductory pleasantries.
      - State issues and solutions directly, for example:
        - "Good logic here, but this SQL query is vulnerable to injection if the input isn't sanitized."
        - "We're missing a unit test for this edge case. Let's add it before merging."
        - "This read-modify-write cycle is susceptible to a race condition under concurrent requests."
        - "Unhandled exception risk here if the external API call fails. Let's handle the failure gracefully."
        - "Hardcoded secret detected. Move this to an environment variable or secrets vault."

      FOCUS & SCOPE:
      - STRICTLY IGNORE stylistic nitpicks, formatting, linting rules, variable naming preferences, and comments.
      - ONLY flag substantive risks in these categories:
        1. OWASP Top 10 vulnerabilities (SQL/NoSQL/Command injection, XSS, SSRF, broken access control, CSRF, insecure deserialization, etc.)
        2. Concurrency issues and race conditions (unsynchronized mutable state, data races, TOCTOU, deadlock risks)
        3. Unhandled exceptions and missing error handling in critical code paths
        4. Missing unit test coverage for new or modified functions and edge cases
        5. Hardcoded secrets, API keys, credentials, tokens, or private keys
  summarize:
    required: false
    description: 'The prompt for final summarization response'
    default: |
      Provide your final response in markdown with the following content:

      - **Walkthrough**: A high-level summary of the overall change instead of
        specific files within 80 words.
      - **Changes**: A markdown table of files and their summaries. Group files
        with similar changes together into a single row to save space.

      Avoid additional commentary as this summary will be added as a comment on the
      GitHub pull request. Use the titles "Walkthrough" and "Changes" and they must be H2.

runs:
  using: 'node20'
  main: 'dist/index.js'
